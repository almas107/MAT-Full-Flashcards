/* Layout: one-column phone-first "exercise book" — graph-paper page, ink outlines that boil like WigglyPaint, marker-coloured stickers. */

  --paper:#f6f8ff; --grid:#d9e2ff; --ink:#1b1e3a; --ink-soft:#5a5f86; --sheet:#ffffff;

}}

  --paper:#171a2b; --grid:#252a45; --ink:#f2f3ff; --ink-soft:#a3a8d6; --sheet:#20243a;
  --shadow:#000000; color-scheme:dark;
}

html,body{height:100%}
body{
  margin:0; font-family:var(--f-body); color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px; font-size:17px; line-height:1.55; overflow-x:hidden;

}

.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
h1,h2,h3{font-family:var(--f-hand);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.3px}
.hand{font-family:var(--f-hand)}
.muted{color:var(--ink-soft)}

/* ---------- wiggle (boiling line) ---------- */
.wig{position:relative}
.wig::before{
  content:"";position:absolute;inset:0;border:3px solid var(--ink);border-radius:inherit;pointer-events:none;
  animation:boil .36s steps(1) infinite;
}

<script>
"use strict";
/* =====================================================================
   MAT Brain Gym — spaced-repetition trainer for the MAT flashcards.
   Progress lives in localStorage and, inside claude.ai, is mirrored to
   the artifact's private per-user db so it survives across devices.
   ===================================================================== */

const LS_KEY = 'matgym:v1';
const DAY = 86400000;
const INTERVALS = [1, 1, 3, 7, 14, 30];   // days, by box 0..5
const MASTER_BOX = 3;
const SUBJ_COLORS = { Physics: 'var(--phy)', Chemistry: 'var(--chem)', Botany: 'var(--bot)', Zoology: 'var(--zoo)' };
const SUBJ_EMOJI = { Physics: '⚛️', Chemistry: '🧪', Botany: '🌿', Zoology: '🐸' };
const MONSTERS = ['👾','🐙','🦖','🐉','👹','🦑','🐲','🦂','🧟','👻','🤖','🦈','🐊','🦇','🕷️'];
// state array slots
const B = 0, D = 1, N = 2, W = 3, R = 4, T = 5, K = 6, F = 7;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtA = s => esc(s).replace(/ \|\| /g, '<br>');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];

function dayNum(ms = Date.now()) { const d = new Date(ms); return Math.floor((ms - d.getTimezoneOffset() * 60000) / DAY); }
function dayFromISO(iso) { const [y, m, d] = iso.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / DAY); }
function isoFromDay(n) { return new Date(n * DAY).toISOString().slice(0, 10); }
function niceDate(n) { return new Date(n * DAY).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }); }

/* ---------------------------- storage ---------------------------- */
let DATA = null, CARDS = [], BYID = new Map(), TOPIC_CARDS = [], CH_CARDS = [];
let ST = {};        // id -> state array
let NOTES = {};     // id -> personal mnemonic
let META = null;
let FRESH_DEVICE = false;   // no local save yet: take settings from the cloud copy

function defaultMeta() {
  return {
    exam: '2026-12-05', buffer: 10, roundSize: 20, mode: 'mix', sound: true, wiggle: true, theme: 'auto',
    subjects: null, xp: 0, bestCombo: 0, log: {}, plan: {}, lastOpen: null, newOrder: 'smart'
  };
}
function lsGet() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
let lsTimer = null;
function saveLocal() {
  clearTimeout(lsTimer);
  lsTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ st: ST, notes: NOTES, meta: META })); } catch (e) { /* storage full or blocked */ }
  }, 300);
}

/* ---- cloud mirror (claude.ai artifact db, private per user) ---- */
const Cloud = {
  col: null, dirty: new Set(), timer: null, busy: false, ok: false,
  async init() {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.col = db.collection('data/users/' + uid);
      const snap = await this.col.get();
      let changed = false;
      const remote = {};
      for (const doc of snap.docs) {
        const body = doc.data() || {};
        remote[doc.id] = body;
        if (doc.id === 'meta') changed = mergeMeta(body.meta || {}) || changed;
        else if (doc.id.startsWith('ch')) changed = mergeChapter(body) || changed;
      }
      this.ok = true;
      if (changed) { saveLocal(); buildNewOrder(); applyLook(); if (!SESSION) render(); toast('☁️ Progress synced'); }
      // push only what this device has that the cloud doesn't
      DATA.chapters.forEach((_, c) => {
        const r = (remote['ch' + c] || {}).st || {}, rn = (remote['ch' + c] || {}).notes || {};
        if (CH_CARDS[c].some(card => (ST[card.i] && (!r[card.i] || (r[card.i][T] || 0) < (ST[card.i][T] || 0))) || (NOTES[card.i] && rn[card.i] !== NOTES[card.i]))) this.dirty.add('ch' + c);

    else if (opts.hint) { s[D] = td + 1; }
    else { s[B] = Math.min(5, s[B] + g); s[D] = td + INTERVALS[s[B]]; }
  }
  const ex = examDay();
  if (s[D] >= ex && td < ex - 1) s[D] = Math.max(td + 1, ex - 1);   // always one last look the day before the exam
  ST[card.i] = s;
  touchCard(card);
  return isNew;
}

/* ---------------------------- queues ---------------------------- */
function nextNewCards(n, filter = () => true) {
  const out = [];
  for (const card of NEW_ORDER) { if (out.length >= n) break; if (!ST[card.i] && enabled(card) && filter(card)) out.push(card); }
  return out;
}
function dueCards(filter = () => true) {
  const td = today();
  return CARDS.filter(c => ST[c.i] && ST[c.i][D] <= td && enabled(c) && filter(c)).sort((a, b) => ST[a.i][D] - ST[b.i][D] || ST[a.i][B] - ST[b.i][B]);
}
function interleave(rev, nw) {
  const out = [], total = rev.length + nw.length;
  let i = 0, j = 0;
  for (let k = 0; k < total; k++) {
    const wantNew = j < nw.length && (i >= rev.length || (j + 1) / (nw.length + 1) <= (k + 1) / (total + 1));
    out.push(wantNew ? nw[j++] : rev[i++]);
  }
  return out;
}
function buildRound(kind, arg) {
  const size = META.roundSize; let q = [];
  if (kind === 'daily') {
    const plan = planToday(), lg = logToday();
    const newLeft = Math.max(0, plan.newGoal - lg.n);
    const due = dueCards();
    // half new / half reviews while today's new goal is open; afterwards reviews first, then bonus new cards
    const rvTake = Math.min(due.length, newLeft > 0 ? size - Math.min(newLeft, Math.ceil(size / 2)) : size);
    const nw = nextNewCards(size - rvTake);
    const rv = shuffle(due.slice(0, Math.max(40, size))).slice(0, rvTake);
    q = interleave(rv, nw);
  } else if (kind === 'errors') {
    q = CARDS.filter(c => { const s = ST[c.i]; return s && s[W] > 0 && (s[B] < MASTER_BOX || s[K] < 2) && enabled(c); })
      .sort((a, b) => ST[b.i][W] - ST[a.i][W] || ST[b.i][T] - ST[a.i][T]).slice(0, size);
    shuffle(q);
  } else if (kind === 'pyq') {
    const pool = CARDS.filter(c => c.y && enabled(c));
    const weak = pool.filter(c => ST[c.i] && !isMastered(ST[c.i]));
    const fresh = pool.filter(c => !ST[c.i]);
    q = shuffle([...shuffle(weak).slice(0, Math.ceil(size / 2)), ...fresh.slice(0, size)]).slice(0, size);
  } else if (kind === 'chapter') {
    const due = dueCards(c => c.c === arg).slice(0, Math.ceil(size / 2));
    const nw = CH_CARDS[arg].filter(c => !ST[c.i]).slice(0, size - due.length);
    let extra = [];
    if (due.length + nw.length < size) extra = shuffle(CH_CARDS[arg].filter(c => ST[c.i] && !isMastered(ST[c.i]) && !due.includes(c))).slice(0, size - due.length - nw.length);
    q = interleave(shuffle([...due, ...extra]), nw);
  } else if (kind === 'list') {
    q = arg.slice(0, size);
  } else if (kind === 'blitz') {
    q = shuffle(CARDS.filter(c => ST[c.i] && enabled(c))).slice(0, size);
  }
  return q;
}

/* ---------------------------- MCQ ---------------------------- */
function mcqFor(card) {
  const a = card.a.split(' || ')[0];
  if (a.length > 90 || /✗/.test(a) || /\n/.test(a)) return null;
  const pool = [...TOPIC_CARDS[card.t], ...shuffle(CH_CARDS[card.c].slice()).slice(0, 80)];
  const seen = new Set([a.trim()]), opts = [];
  for (const o of shuffle(pool.slice())) {
    const oa = o.a.split(' || ')[0].trim();
    if (o === card || seen.has(oa) || /✗/.test(oa)) continue;
    const ratio = oa.length / Math.max(1, a.length);
    if (ratio < .35 || ratio > 2.6 || oa.length > 110) continue;
    seen.add(oa); opts.push(oa);
    if (opts.length === 3) break;
  }
  if (opts.length < 3) return null;
  const all = shuffle([a.trim(), ...opts]);
  return { opts: all, right: all.indexOf(a.trim()) };
}

/* ---------------------------- XP / levels ---------------------------- */

function addXP(n) {

  const after = levelOf(META.xp);

function endSession(quit) {
  const S = SESSION; SESSION = null;
  const n = S.results.length, ok = S.results.filter(Boolean).length;
  if (!n) { render(); return; }
  const acc = ok / n;
  const plan = planToday(), lg = logToday();
  const goalNow = Math.min(lg.n, plan.newGoal) + Math.min(lg.rv, plan.dueGoal) >= plan.newGoal + plan.dueGoal;
  const firstGoal = goalNow && !lg.goalHit;
  let bonus = quit ? 0 : 50;
  if (firstGoal) { lg.goalHit = 1; bonus += 200; }
  addXP(bonus); touchMeta();
  const stars = acc >= .95 ? 3 : acc >= .8 ? 2 : acc >= .6 ? 1 : 0;
  const word = firstGoal ? 'DAILY GOAL DONE!' : stars === 3 ? 'PERFECT-ISH!' : stars === 2 ? 'NICE ROUND!' : stars === 1 ? 'GETTING THERE' : 'TOUGH ONE';
  const mood = firstGoal || stars === 3 ? 'party' : stars >= 1 ? 'happy' : 'sad';
  render();
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet wig modal pop stack" role="dialog" aria-label="Round summary">
    <div style="max-width:110px;margin:0 auto">${mascotSVG(mood)}</div>
    <div class="bigword boil" style="color:${firstGoal ? 'var(--pink)' : 'var(--ink)'}">${word}</div>
    <div class="stars">${[0, 1, 2].map(k => `<span style="animation-delay:${k * .18}s">${k < stars ? '⭐' : '☆'}</span>`).join('')}</div>
    <div class="statline">
      <div class="stat"><b class="num">${Math.round(acc * 100)}%</b><small>accuracy</small></div>
      <div class="stat"><b class="num">${ok}/${n}</b><small>correct</small></div>
      <div class="stat"><b class="num">×${S.best}</b><small>best combo</small></div>
      <div class="stat"><b class="num">+${S.xp + bonus}</b><small>XP</small></div>
    </div>
    ${acc < .9 ? `<p class="muted" style="margin:0;font-weight:600;text-align:center">Below 90%. Missed cards come back tomorrow, and they're in your Error log now.</p>` : ''}
    <div class="grid2"><button class="btn lemon" id="ovHome">🏠 Home</button><button class="btn pink" id="ovAgain">▶ Another round</button></div>
    <button class="btn small" id="ovBreak" style="align-self:center">😮‍💨 2-min brain break</button>
  </div>`;
  document.body.appendChild(ov);
  if (stars >= 2 || firstGoal) { Sound.play('fanfare'); Confetti.burst(innerWidth / 2, innerHeight / 3, firstGoal ? 220 : 110, firstGoal ? 1.5 : 1.1); }
  else Sound.play(stars ? 'good' : 'boing', 3);
  const close = () => ov.remove();
  $('#ovHome', ov).onclick = () => { close(); VIEW = 'home'; render(); };
  $('#ovAgain', ov).onclick = () => { close(); startSession(S.kind === 'list' ? 'errors' : S.kind, S.arg); };
  $('#ovBreak', ov).onclick = () => { close(); brainBreak(); };
}
function brainBreak() {
  const ov = document.createElement('div'); ov.className = 'overlay';
  let left = 120;
  const tips = ['Stand up and stretch 🙆', 'Drink some water 💧', 'Look at something far away 👀', 'Breathe in 4 s… hold 4… out 4…', 'Recall 3 cards from the last round without looking 🧠'];
  ov.innerHTML = `<div class="sheet wig modal stack" style="text-align:center"><div style="max-width:110px;margin:0 auto">${mascotSVG('sleepy')}</div>
    <div class="bigword num" id="bbT">2:00</div><p style="font-weight:700;margin:0" id="bbTip">${tips[0]}</p>
    <button class="btn pink" id="bbGo">I'm back ▶ next round</button></div>`;
  document.body.appendChild(ov);
  const iv = setInterval(() => {
    left--; const t = $('#bbT', ov); if (!t) return clearInterval(iv);
    t.textContent = `${left / 60 | 0}:${String(left % 60).padStart(2, '0')}`;
    if (left % 24 === 0) $('#bbTip', ov).textContent = tips[(120 - left) / 24 % tips.length];
    if (left <= 0) { clearInterval(iv); Sound.play('fanfare'); t.textContent = 'GO!'; }
  }, 1000);
  $('#bbGo', ov).onclick = () => { clearInterval(iv); ov.remove(); startSession('daily'); };
}

/* ---------------------------- progress map ---------------------------- */
function chapterStats(c) {
  let seen = 0, m = 0, due = 0; const td = today();
  for (const card of CH_CARDS[c]) { const s = ST[card.i]; if (s) { seen++; if (isMastered(s)) m++; if (s[D] <= td) due++; } }
  return { total: CH_CARDS[c].length, seen, m, due };
}

        <div class="bar"><i style="width:${c.seen / Math.max(1, c.total) * 100}%;background:var(--sky)"></i></div></div>
      <div><div class="row" style="justify-content:space-between;font-weight:700"><span>Mastered (passed 2 spaced recalls)</span><span class="num">${Math.round(c.mastered / Math.max(1, c.total) * 100)}%</span></div>
        <div class="bar"><i style="width:${c.mastered / Math.max(1, c.total) * 100}%"></i></div></div>
      <div><div class="row" style="justify-content:space-between;font-weight:700"><span>Accuracy, last 7 days (target 90%)</span><span class="num">${acc === null ? '–' : Math.round(acc * 100) + '%'}</span></div>
        <div class="bar"><i style="width:${(acc || 0) * 100}%;background:${(acc || 0) >= .9 ? 'var(--good)' : 'var(--warn)'}"></i><span class="goalmark" style="left:90%"></span></div></div>
      <div class="row muted" style="font-weight:700;font-size:14px"><span>⭐ Level ${L.lv} · ${L.title}</span><span>· ${META.xp.toLocaleString()} XP</span><span>· best combo ×${META.bestCombo}</span></div>
    </div>
    <div class="sheet stack">
      <h3 style="font-size:24px">Subjects</h3>
      ${subj.map(s => `<div class="subjrow"><span>${SUBJ_EMOJI[s.name]} ${s.name}</span><div class="bar"><i style="width:${s.m / Math.max(1, s.t) * 100}%;background:${SUBJ_COLORS[s.name]}"></i></div><span class="num" style="text-align:right">${Math.round(s.m / Math.max(1, s.t) * 100)}%</span></div>`).join('')}
    </div>
    <div class="sheet stack">
      <h3 style="font-size:24px">Study calendar</h3>
      <div class="heat">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<div class="muted" style="text-align:center;font-weight:700;font-size:12px">${d}</div>`).join('')}
      ${days.map(d => { const e = META.log[isoFromDay(d)], n = e ? e.tot : 0; const lv = n === 0 ? '' : n < 60 ? 'l1' : n < 200 ? 'l2' : 'l3';
        return `<div class="hd ${lv} ${d === td ? 'today' : ''} ${d === ex ? 'exam' : ''} ${d > td && d !== ex ? 'future' : ''}" title="${isoFromDay(d)}: ${n} cards">${d === ex ? 'MAT' : new Date(d * DAY).getUTCDate()}</div>`; }).join('')}</div>

      ${DATA.subjects.map((sn, si) => `<div class="stack" style="gap:8px"><b>${SUBJ_EMOJI[sn]} ${sn}</b><div class="chlist">${DATA.chapters.map((ch, ci) => {
        if (ch.s !== si) return ''; const st = chapterStats(ci), hp = 1 - st.m / st.total, dead = hp <= .02;

          <span class="nm"><div>${esc(ch.p.replace('পদার্থবিজ্ঞান', 'পদার্থ').replace(' পত্র', ''))} · ${esc(ch.t)}</div><div class="hp"><i style="width:${hp * 100}%"></i></div></span>
          <span class="num muted" style="font-size:13px;text-align:right">${st.m}/${st.total}${st.due ? `<br><span style="color:var(--pink)">${st.due} due</span>` : ''}</span></button>`;

/* ---------------------------- error log ---------------------------- */
let ERR_FILTER = { q: '', weak: true, subj: -1 };
function renderErrors() {
  let list = CARDS.filter(c => { const s = ST[c.i]; return s && s[W] > 0; });
  const weakOf = c => ST[c.i][B] < MASTER_BOX || ST[c.i][K] < 2;
  const totalErr = list.length, weakN = list.filter(weakOf).length;
  if (ERR_FILTER.weak) list = list.filter(weakOf);
  if (ERR_FILTER.subj >= 0) list = list.filter(c => DATA.chapters[c.c].s === ERR_FILTER.subj);
  if (ERR_FILTER.q) { const q = ERR_FILTER.q.toLowerCase(); list = list.filter(c => (c.q + ' ' + c.a).toLowerCase().includes(q)); }
  list.sort((a, b) => ST[b.i][W] - ST[a.i][W] || ST[b.i][T] - ST[a.i][T]);
  const shown = list.slice(0, 150);
  app().innerHTML = `${topBar()}<div class="stack">
    <div class="sheet wig stack">
      <h2 style="font-size:28px">📕 Error log</h2>
      <p class="muted" style="margin:0;font-weight:600">Every card you missed lands here. It counts as fixed after 2 right answers in a row and reaching box 3. Still weak: <b>${weakN}</b> · ever missed: <b>${totalErr}</b>.</p>
      <input class="input" id="eq" placeholder="Search your mistakes…" value="${esc(ERR_FILTER.q)}">
      <div class="seg" id="eseg">
        <button data-w="1" aria-pressed="${ERR_FILTER.weak}">Still weak</button><button data-w="0" aria-pressed="${!ERR_FILTER.weak}">All misses</button>
        <span style="width:8px"></span>
        <button data-s="-1" aria-pressed="${ERR_FILTER.subj === -1}">All</button>${DATA.subjects.map((s, i) => `<button data-s="${i}" aria-pressed="${ERR_FILTER.subj === i}">${SUBJ_EMOJI[s]} ${s}</button>`).join('')}
      </div>
      <button class="btn pink" id="edrill" ${list.length ? '' : 'disabled'}>🎯 Drill these (${Math.min(list.length, META.roundSize)} worst)</button>
    </div>
    <div class="stack" style="gap:10px">${shown.length ? shown.map(c => { const s = ST[c.i], fixed = !weakOf(c);
      return `<div class="err"><div style="min-width:0"><div class="topic">${esc(DATA.chapters[c.c].t)}</div><div style="font-weight:700">${fmtA(c.q)}</div><div class="ea">${fmtA(c.a)}</div>${NOTES[c.i] ? `<div class="muted" style="font-size:14px">✏️ ${esc(NOTES[c.i])}</div>` : ''}</div>
        <div class="x ${fixed ? 'fixed' : ''}">${fixed ? '✓' : '✗' + s[W]}<div class="muted" style="font-size:12px;font-family:var(--f-body)">${s[R]}✓ ${s[W]}✗</div></div></div>`; }).join('')
      : `<div class="sheet" style="text-align:center"><div style="max-width:100px;margin:0 auto">${mascotSVG('party')}</div><p style="font-weight:700">No mistakes here. Go make some (it's how you learn)!</p></div>`}
      ${list.length > shown.length ? `<p class="muted" style="text-align:center">…and ${list.length - shown.length} more. Search to narrow it down.</p>` : ''}
    </div></div>`;
  bindTop();
  const eq = $('#eq'); eq.oninput = () => { ERR_FILTER.q = eq.value; clearTimeout(eq._t); eq._t = setTimeout(() => { renderErrors(); const n = $('#eq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  document.querySelectorAll('#eseg button').forEach(b => b.onclick = () => { if (b.dataset.w) ERR_FILTER.weak = b.dataset.w === '1'; else ERR_FILTER.subj = +b.dataset.s; Sound.play('pop'); renderErrors(); });
  $('#edrill').onclick = () => startSession('list', list.slice(0, META.roundSize));
}

  app().innerHTML = `${topBar()}<div class="stack">
    <div class="sheet wig stack">

      <div class="set" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:700"><span>📚 Subjects</span><span class="seg" id="sSubj">${DATA.subjects.map((s, i) => `<button data-i="${i}" aria-pressed="${subjOn(i)}">${SUBJ_EMOJI[s]} ${s}</button>`).join('')}</span></div>
      <label class="set">🔊 Sounds <input type="checkbox" id="sSound" ${META.sound ? 'checked' : ''}></label>

      <label class="set">🌗 Theme <select id="sTheme"><option value="auto" ${META.theme === 'auto' ? 'selected' : ''}>Auto</option><option value="light" ${META.theme === 'light' ? 'selected' : ''}>Paper (light)</option><option value="dark" ${META.theme === 'dark' ? 'selected' : ''}>Chalkboard (dark)</option></select></label>
      <p class="muted" style="margin:0;font-size:14px;font-weight:600">Changes to the date or subjects re-balance <b>tomorrow's</b> goal. Today's goal stays fixed so it can't run away from you.</p>
      <button class="btn small" id="sReplan">↻ Re-balance today's goal now</button>
    </div>
    <div class="sheet stack">
      <h3 style="font-size:24px">💾 Backup</h3>
      <p class="muted" style="margin:0;font-weight:600">${Cloud.ok ? '☁️ Cloud sync is on: progress follows your claude.ai account to any device.' : 'Progress is saved in this browser. Copy a backup now and then, just in case.'}</p>
      <div class="row"><button class="btn small" id="bCopy">📋 Copy backup</button><button class="btn small" id="bLoad">📥 Restore from pasted backup</button></div>
      <textarea class="backup" id="bText" placeholder="Paste a backup here, then tap Restore"></textarea>
    </div>
    <div class="sheet stack">
      <h3 style="font-size:24px">How this works</h3>
      <ul style="margin:0;padding-left:20px;font-weight:600">
        <li><b>Active recall:</b> answer in your head <i>before</i> flipping. Be honest with ❌. Faking ✅ only hurts you.</li>
        <li><b>Spaced repetition:</b> cards come back after 1 → 3 → 7 → 14 → 30 days. Miss one and it drops back to tomorrow.</li>
        <li><b>Mastered</b> = you recalled it at 1-day and 3-day gaps. That's long-term memory, not cramming.</li>
        <li><b>Daily goal</b> = cards you haven't seen ÷ days until revision starts, plus reviews due today. Skip a day and the goal re-balances. Progress never fakes itself.</li>

  bindTop();
  const on = (id, ev, fn) => { $(id).addEventListener(ev, () => { fn($(id)); touchMeta(); Sound.play('pop'); }); };

  on('#sBuf', 'change', el => { META.buffer = clamp(+el.value || 0, 0, 30); });
  on('#sRound', 'change', el => { META.roundSize = +el.value; });
  on('#sMode', 'change', el => { META.mode = el.value; });

  on('#sSound', 'change', el => { META.sound = el.checked; });
  on('#sWig', 'change', el => { META.wiggle = el.checked; applyLook(); });

  document.querySelectorAll('#sSubj button').forEach(b => b.onclick = () => {
    const i = +b.dataset.i; let s = META.subjects ? META.subjects.slice() : DATA.subjects.map((_, k) => k);
    s = s.includes(i) ? s.filter(x => x !== i) : [...s, i].sort();
    if (!s.length) return toast('Keep at least one subject on');
    META.subjects = s.length === DATA.subjects.length ? null : s; touchMeta(); Sound.play('pop'); renderSettings();
  });
  $('#sReplan').onclick = () => { delete META.plan[isoFromDay(today())]; planToday(); toast('Today\'s goal re-balanced'); };
  $('#bCopy').onclick = () => {
    const txt = JSON.stringify({ st: ST, notes: NOTES, meta: META });
    const ta = $('#bText'); ta.value = txt;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Backup copied. Paste it somewhere safe.'), () => { ta.select(); toast('Select-all + copy the text below'); });

}
function applyLook() {
  document.body.classList.toggle('nowiggle', !META.wiggle);
  if (META.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', META.theme);
}

/* ---------------------------- keyboard ---------------------------- */
addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  const S = SESSION; if (!S) return;
  if (e.key === 'Escape') return endSession(true);
  if (S.mcq) {
    if (!S.answered && /^[1-4]$/.test(e.key)) answerMcq(+e.key - 1);
    else if (S.answered && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); advance(); }
    return;
  }
  if (!S.flipped) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
    else if (e.key.toLowerCase() === 'h' && !S.hint) { S.hint = true; renderPlay(); }
  } else {
    if (e.key === '1' || e.key === 'ArrowLeft') answerFlip(0);
    else if (e.key === '2' || e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); answerFlip(1); }
    else if (e.key === '3') answerFlip(2);
  }
});

/* ---------------------------- boot ---------------------------- */
async function boot() {
  Confetti.init();
  try {
    const res = await fetch('cards.json');
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
  } catch (e) {
    app().innerHTML = `<div class="loading"><div class="sheet wig"><h2>Couldn't load the cards</h2><p>cards.json must sit next to this page. To run it locally, use <code>python3 -m http.server</code> inside the webapp folder.</p></div></div>`;
    return;
  }
  CARDS = DATA.cards;
  TOPIC_CARDS = DATA.topics.map(() => []); CH_CARDS = DATA.chapters.map(() => []);
  for (const c of CARDS) { BYID.set(c.i, c); TOPIC_CARDS[c.t].push(c); CH_CARDS[c.c].push(c); }
  const saved = lsGet();
  FRESH_DEVICE = !saved;
  META = Object.assign(defaultMeta(), saved && saved.meta || {});
  ST = saved && saved.st || {}; NOTES = saved && saved.notes || {};
  for (const id of Object.keys(ST)) if (!BYID.has(id)) delete ST[id];
  buildNewOrder(); applyLook();
  META.lastOpen = isoFromDay(today()); saveLocal();
  $('#tabs').hidden = false;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { Sound.play('pop'); setTab(b.dataset.tab); });
  render();
  Cloud.init();
  // a new day may start while the page is open
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!SESSION) render(); } }, 60000);
  addEventListener('visibilitychange', () => { if (document.hidden) { Cloud.flush(); } else if (!SESSION) render(); });
}
boot();
</script>
